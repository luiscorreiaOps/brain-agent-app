services:
  grafana:
    image: grafana/grafana:12.3.1
    container_name: brain-agent-dev
    ports:
      - "3000:3000"
    volumes:
      - ./dist:/var/lib/grafana/plugins/brain-agent-app:Z
      - ./provisioning:/etc/grafana/provisioning:Z
    environment:
      - GF_DEFAULT_APP_MODE=development
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=brain-agent-app
      - GF_SECURITY_ADMIN_PASSWORD=admin
