name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Clean release artifacts
        run: |
          rm -rf brain-agent-app
          rm -f brain-agent-app-*.zip brain-agent-app-*.zip.sha1

      - name: Build, package, and validate plugin
        id: package-plugin
        uses: grafana/plugin-actions/package-plugin@main
        with:
          go-version: '1.26.5'
          node-version: 22
          policy_token: ${{ vars.GRAFANA_SIGN_PLUGIN == 'true' && secrets.GRAFANA_ACCESS_POLICY_TOKEN || '' }}

      - name: Get plugin metadata
        id: metadata
        run: echo "github-tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Print package outputs
        run: |
          printf "archive=%s\n" "${PLUGIN_ARCHIVE}"
          printf "archive-sha1sum=%s\n" "${PLUGIN_ARCHIVE_SHA1SUM}"
          printf "plugin-id=%s\n" "${PLUGIN_ID}"
          printf "plugin-version=%s\n" "${PLUGIN_VERSION}"
        env:
          PLUGIN_ARCHIVE: ${{ steps.package-plugin.outputs.archive }}
          PLUGIN_ARCHIVE_SHA1SUM: ${{ steps.package-plugin.outputs.archive-sha1sum }}
          PLUGIN_ID: ${{ steps.package-plugin.outputs.plugin-id }}
          PLUGIN_VERSION: ${{ steps.package-plugin.outputs.plugin-version }}

      - name: Check package version
        run: |
          if [ "v${PLUGIN_VERSION}" != "${GITHUB_TAG}" ]; then
            printf "Plugin version does not match tag name. The tag should be v%s\n" "${PLUGIN_VERSION}"
            exit 1
          fi
        env:
          PLUGIN_VERSION: ${{ steps.package-plugin.outputs.plugin-version }}
          GITHUB_TAG: ${{ steps.metadata.outputs.github-tag }}

      - name: Create GitHub draft release
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./${{ steps.package-plugin.outputs.archive }}
            ./${{ steps.package-plugin.outputs.archive-sha1sum }}
          body: |
            Draft release for Grafana plugin `${{ steps.package-plugin.outputs.plugin-id }}`.

            Plugin version: `${{ steps.package-plugin.outputs.plugin-version }}`
