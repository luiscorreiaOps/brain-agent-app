name: Develop Quality Gate

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: develop-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Project validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          warn-only: false

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Check committed artifacts
        run: |
          set -euo pipefail
          tracked_artifacts="$(git ls-files \
            '.cache/*' \
            '.magefile/*' \
            'dist/*' \
            'go/*' \
            'node_modules/*' \
            'node_modules.bak-*/*' \
            'plugin-dist/*' \
            '*.zip' \
            '*.tar' \
            '*.tar.gz' \
            '*.tgz' \
            '*.rar' \
            '*.7z' \
            '*.exe' \
            '*.dll' \
            '*.so' \
            '*.dylib' \
            '*.apk' \
            '*.deb' \
            '*.rpm' \
            '*.msi' \
            '*.jar' \
            '*.war' \
            '*.class' \
            '*.wasm' \
            '*.db' \
            '*.db-shm' \
            '*.db-wal' \
            '*.sqlite' \
            '*.sqlite3')"
          if [ -n "$tracked_artifacts" ]; then
            echo "::error::Do not commit generated archives, plugin build output, binaries, or local Brain Agent database files:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Check sensitive file names
        run: |
          set -euo pipefail
          sensitive_files="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|id_rsa|id_dsa|id_ecdsa|id_ed25519|.*\.(pem|key|p12|pfx|crt|cer)|.*(token|secret|password).*\.(json|yaml|yml|txt))$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "$sensitive_files" ]; then
            echo "::error::Sensitive-looking files must not be committed:"
            echo "$sensitive_files"
            exit 1
          fi

      - name: Check npm lockfile registries
        run: |
          set -euo pipefail
          bad_urls="$(jq -r '.. | objects | .resolved? // empty' package-lock.json | grep -Ev '^https://registry\.npmjs\.org/' || true)"
          if [ -n "$bad_urls" ]; then
            echo "::error::package-lock.json contains package tarballs outside registry.npmjs.org:"
            echo "$bad_urls"
            exit 1
          fi

      - name: Check Go formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l Magefile.go pkg)"
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./pkg/...

      - name: Build backend package
        run: go build -buildvcs=false ./pkg/...

      - name: Verify Go modules
        run: go mod verify

      - name: Go tests
        run: go test -v -race -count=1 ./pkg/...

      - name: Go security scan
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./pkg/...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./pkg/...

      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --source . --no-git --config .gitleaks.toml --redact --verbose

      - name: Frontend audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Build backend binaries
        run: |
          set -euo pipefail
          mage -v
          chmod 0755 dist/gpx_*

      - name: Check React 19 runtime compatibility
        run: |
          set -euo pipefail
          if grep -R "__SECRET_INTERNALS" dist/*.js dist/*.map 2>/dev/null; then
            echo "::error::Bundle contains React private internals and may break on newer Grafana React runtimes."
            exit 1
          fi

      - name: Check backend executable name
        run: |
          set -euo pipefail
          executable="$(jq -r '.executable' src/plugin.json)"
          if ! ls "dist/${executable}"_* >/dev/null 2>&1; then
            echo "::error::Mage build did not produce binaries matching src/plugin.json executable '${executable}'."
            ls -la dist || true
            exit 1
          fi

      - name: Check generated plugin metadata
        run: |
          set -euo pipefail
          src_id="$(jq -r '.id' src/plugin.json)"
          dist_id="$(jq -r '.id' dist/plugin.json)"
          src_dependency="$(jq -r '.dependencies.grafanaDependency' src/plugin.json)"
          dist_dependency="$(jq -r '.dependencies.grafanaDependency' dist/plugin.json)"
          if [ "$src_id" != "$dist_id" ]; then
            echo "::error::dist/plugin.json does not match src/plugin.json id."
            echo "src:  $src_id"
            echo "dist: $dist_id"
            exit 1
          fi
          if [ "$src_dependency" != "$dist_dependency" ]; then
            echo "::error::dist/plugin.json does not match src/plugin.json grafanaDependency."
            echo "src:  $src_dependency"
            echo "dist: $dist_dependency"
            exit 1
          fi

      - name: Package plugin archive
        id: package
        run: |
          set -euo pipefail
          plugin_id="$(jq -r '.id' src/plugin.json | tr -cd 'a-zA-Z0-9._-')"
          version="$(jq -r '.info.version' src/plugin.json)"
          archive_name="${plugin_id}-${version}-${GITHUB_SHA::7}.zip"
          package_dir="$(mktemp -d)"
          mkdir -p "${package_dir}/${plugin_id}"
          cp -R dist/. "${package_dir}/${plugin_id}/"
          (cd "$package_dir" && zip -qr "${GITHUB_WORKSPACE}/${archive_name}" "$plugin_id")
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Validate plugin archive
        run: npx --cache .cache/npm -y @grafana/plugin-validator@latest -jsonOutput "${{ steps.package.outputs.archive_name }}"

      - name: Upload validation archive
        uses: actions/upload-artifact@v4
        with:
          name: grafana-plugin-archive
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
