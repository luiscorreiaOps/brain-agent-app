apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: brain-agent
type: Opaque
stringData:
  password: "REPLACE_ME_WITH_A_REAL_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-plugin-config
  namespace: brain-agent
stringData:
  brain-agent.yaml: |
    apiVersion: 1
    apps:
      - type: brain-agent
        org_id: 1
        disabled: false
        jsonData:
          # All fields below are optional -- brain-agent runs with sane
          # defaults (semantic search on, strict per-project tenancy on,
          # auto-learn off, at-rest encryption off) even with an empty
          # jsonData block.
          semanticSearchEnabled: true
          strictTenancyEnabled: true
          autoLearnAlerts: false
          grafanaURL: "http://grafana-service.brain-agent.svc:3000"
          maxMemories: 50
          ragOverlapThreshold: 0.0
          retentionDays: 0
          floodLimitPerMinute: 0
          maxDbSizeMB: 500
          auditLoggingEnabled: false
          atRestEncryptionEnabled: false
        secureJsonData:
          # Only needed if autoLearnAlerts is true above -- a Grafana
          # service account token with at least Viewer access, used to poll
          # the alerting API.
          grafanaToken: "REPLACE_ME_WITH_A_REAL_SERVICE_ACCOUNT_TOKEN"
